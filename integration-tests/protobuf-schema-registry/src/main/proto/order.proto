syntax = "proto3";

package io.questdb.kafka.domain;

import "google/protobuf/timestamp.proto";

option java_package = "io.questdb.kafka.domain";
option java_outer_classname = "OrderProtos";
option java_multiple_files = true;

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PLACED = 1;
  SHIPPED = 2;
  DELIVERED = 3;
}

message Address {
  string city = 1;
  string country = 2;
}

message Order {
  string order_id = 1;
  google.protobuf.Timestamp created_at = 2;
  OrderStatus status = 3;
  Address shipping = 4;
  int32 quantity = 5;
  double price = 6;
}
