services:
  questdb:
    image: questdb/questdb:10.0.1
    ports:
      - "19000:9000"
    environment:
      - QDB_LINE_DEFAULT_PARTITION_BY=YEAR
      - QDB_PG_SELECT_CACHE_ENABLED=false
  grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning/
      - ./grafana/dashboards/:/var/lib/grafana/dashboards/
    depends_on:
      - questdb
    environment:
        - GF_SECURITY_ADMIN_PASSWORD=quest
        - GF_SECURITY_ADMIN_USER=admin
        - GF_USERS_ALLOW_SIGN_UP=false
        - GF_USERS_ALLOW_ORG_CREATE=false
        - GF_AUTH_ANONYMOUS_ENABLED=true
        - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
        - GF_AUTH_ANONYMOUS_ORG_ID=1
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  postgres:
    image: postgres:18
    # Debezium reads the Postgres write-ahead log, which requires logical decoding.
    command: postgres -c wal_level=logical
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
  producer:
    image: kafka-questdb-connector-samples-stocks-generator
    build:
      dockerfile: Dockerfile-App
      context: .
    depends_on:
      postgres:
        condition: service_healthy
  connect:
    image: kafka-questdb-connector-samples-connect
    build:
      dockerfile: Dockerfile-Connect
      context: .
    ports:
      - "8083:8083"
    depends_on:
      - kafka
