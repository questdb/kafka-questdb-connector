syntax = "proto3";

package io.questdb.kafka.samples;

import "google/protobuf/timestamp.proto";

option java_package = "io.questdb.kafka.samples";
option java_outer_classname = "TradeProtos";
option java_multiple_files = true;

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

// One executed trade. The connector maps every field to a column of the
// QuestDB table, see the readme for the exact type mapping.
message Trade {
  string symbol = 1;
  Side side = 2;
  double price = 3;
  int64 quantity = 4;
  string exchange = 5;
  google.protobuf.Timestamp timestamp = 6;
}
