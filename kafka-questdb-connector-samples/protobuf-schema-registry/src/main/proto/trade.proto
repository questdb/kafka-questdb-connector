syntax = "proto3";

package io.questdb.kafka.samples;

import "google/protobuf/timestamp.proto";

option java_package = "io.questdb.kafka.samples";
option java_outer_classname = "TradeProtos";
option java_multiple_files = true;

// One executed trade, the same shape as the `trades` table on https://demo.questdb.io.
// The connector maps every field to a column of the QuestDB table, see the readme for
// the exact type mapping.
message Trade {
  string symbol = 1;
  string side = 2;   // "buy" or "sell"
  double price = 3;
  double amount = 4;
  google.protobuf.Timestamp timestamp = 5;
}
